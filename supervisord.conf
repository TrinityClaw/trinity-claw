[supervisord]
nodaemon=true
# Promenjeno: Logovi idu u /tmp/ jer su tamo dozvole slobodne
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

; ── ChromaDB vector store ────────────────────────────────
[program:chroma]
command=chroma run --path /tmp/chroma --host 127.0.0.1 --port 8000
directory=/app
autostart=true
autorestart=true
priority=10
# Promenjeno: stdout i stderr logovi u /tmp/
stdout_logfile=/tmp/chroma.log
stderr_logfile=/tmp/chroma.err

; ── LiteLLM proxy ───────────────────────────────────────
[program:litellm]
command=litellm --config /app/config/litellm_config.yaml --port 4000 --num_workers 1
directory=/app
autostart=true
autorestart=true
priority=20
# Promenjeno: SQLite baza u /tmp/ da bi mogla da se kreira
environment=DATABASE_URL="sqlite:////tmp/litellm.db"
stdout_logfile=/tmp/litellm.log
stderr_logfile=/tmp/litellm.err

; ── Trinity Agent FastAPI ────────────────────────────────
[program:trinity-agent]
command=python app.py
directory=/app/agent
autostart=true
autorestart=true
priority=30
environment=LITELLM_API_BASE="http://127.0.0.1:4000",CHROMA_HOST="127.0.0.1",CHROMA_PORT="8000",PYTHONUNBUFFERED="1"
stdout_logfile=/tmp/agent.log
stderr_logfile=/tmp/agent.err

; ── Nginx ──────────────────────────────────────────────────
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=40
stdout_logfile=/tmp/nginx.log
stderr_logfile=/tmp/nginx.err
