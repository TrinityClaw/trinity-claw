[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info
user=hfuser

; ── ChromaDB vector store (internal port 8000) ────────────────────────────────
[program:chroma]
command=chroma run --path /data/chroma --host 127.0.0.1 --port 8000
directory=/app
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/chroma.log
stderr_logfile=/var/log/supervisor/chroma.err

; ── LiteLLM proxy (internal port 4000) ───────────────────────────────────────
; Uses SQLite by default (no PostgreSQL needed on HF Spaces)
[program:litellm]
command=litellm --config /app/config/litellm_config.hf.yaml --port 4000 --num_workers 1
directory=/app
autostart=true
autorestart=true
priority=20
environment=DATABASE_URL="sqlite:////data/litellm.db"
stdout_logfile=/var/log/supervisor/litellm.log
stderr_logfile=/var/log/supervisor/litellm.err

; ── Trinity Agent FastAPI (internal port 8001) ────────────────────────────────
[program:trinity-agent]
command=python app.py
directory=/app/agent
autostart=true
autorestart=true
priority=30
environment=LITELLM_API_BASE="http://127.0.0.1:4000",CHROMA_HOST="127.0.0.1",CHROMA_PORT="8000",PYTHONUNBUFFERED="1"
stdout_logfile=/var/log/supervisor/agent.log
stderr_logfile=/var/log/supervisor/agent.err

; ── Nginx (public port 7860) ──────────────────────────────────────────────────
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err
