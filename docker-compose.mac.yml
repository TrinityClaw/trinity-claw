version: '3.8'

# ============================================================
# Trinity Claw — Mac M4 (Apple Silicon) Configuration
# ============================================================
# Ollama runs NATIVELY on Mac for full Metal GPU acceleration.
# Do NOT use --profile local here — Ollama is outside Docker.
#
# Setup: run the installer — it handles everything automatically.
#   bash install-mac.sh && bash install.sh
#
# After install, TrinityClaw starts automatically on every Mac login.
# Ollama is managed by: brew services start ollama (set up by installer)
# ============================================================

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file: .env
    volumes:
      - ./config/litellm_config.yaml:/app/litellm_config.yaml
    command: [ "--config", "/app/litellm_config.yaml" ]
    depends_on:
      - db

  chroma:
    image: chromadb/chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  db:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_USER: llmuser
      POSTGRES_PASSWORD: llmpassword
      POSTGRES_DB: litellm
    volumes:
      - pg_data:/var/lib/postgresql/data

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - trinity-agent

  trinity-agent:
    build: ./agent
    restart: unless-stopped
    ports:
      - "8001:8001"
      - "8090:8090"  # web_builder preview server
    env_file: .env
    environment:
      - LITELLM_API_BASE=http://litellm:4000
      - OLLAMA_API_BASE=http://host.docker.internal:11434  # Native Ollama on Mac host
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - LITELLM_MASTER_KEY=sk-1234567890
      - PYTHONUNBUFFERED=1
      # ── LLM temperatures ──────────────────────────────────────────────────────
      - AGENT_TEMPERATURE_LOCAL=1.0   # Ollama / local model (Gemma 4 optimal for agentic tasks)
      - AGENT_TEMPERATURE_CLOUD=0.2   # LiteLLM / cloud model
      # ── Local model context window ────────────────────────────────────────────
      # Apple Silicon: Ollama runs natively (not in Docker).
      # Set OLLAMA_FLASH_ATTENTION=1 and OLLAMA_KV_CACHE_TYPE=q8_0
      # in your shell profile (~/.zshrc) or via: launchctl setenv.
      # 4096 keeps KV cache in unified memory fast path.
      # Bump to 8192 only for long doc / deep research sessions.
      - OLLAMA_NUM_CTX=4096
      - AGENT_MAX_ITERATIONS=10           # default 20 → 10 caps worst-case chains
    volumes:
      - "./memory:/app/memory:rw"
      - "./agent/skills/dynamic:/app/skills/dynamic:rw"
      - "./.env:/app/.env"
      - "./config/litellm_config.yaml:/app/litellm_config.yaml"
      - "./agent/app.py:/app/app.py:ro"
      - "./agent/skills/core:/app/skills/core:ro"
      - "./identity.md:/app/identity.md:ro"
    depends_on:
      - litellm
      - chroma

volumes:
  chroma_data:
  pg_data:
