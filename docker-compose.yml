version: '3.8'

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    env_file: .env
    volumes:
      - ./config/litellm_config.yaml:/app/litellm_config.yaml
    command: [ "--config", "/app/litellm_config.yaml" ]
    depends_on:
      - db

  chroma:
    image: chromadb/chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: llmuser
      POSTGRES_PASSWORD: llmpassword
      POSTGRES_DB: litellm
    volumes:
      - pg_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_KEEP_ALIVE=5m
    volumes:
      - ollama_data:/root/.ollama
      - ./agent/ollama-entrypoint.sh:/entrypoint.sh
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    entrypoint: /entrypoint.sh
    profiles:
      - local # Only starts with: docker compose --profile local up -d

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - trinity-agent

  trinity-agent:
    build: ./agent
    ports:
      - "8001:8001"
      - "8090:8090"  # web_builder preview server
    env_file: .env
    environment:
      - LITELLM_API_BASE=http://litellm:4000
      - OLLAMA_API_BASE=http://ollama:11434
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - LITELLM_MASTER_KEY=sk-1234567890
      - MODEL_SOURCE=cloud
      - PYTHONUNBUFFERED=1
    volumes:
      - "./memory:/app/memory:rw"
      - "./agent/skills/dynamic:/app/skills/dynamic:rw"
      - "./.env:/app/.env"
      - "./config/litellm_config.yaml:/app/litellm_config.yaml"
      - "./agent/app.py:/app/app.py:ro"
      - "./agent/skills/core:/app/skills/core:ro"
    depends_on:
      - litellm
      - chroma

volumes:
  chroma_data:
  pg_data:
  ollama_data:
