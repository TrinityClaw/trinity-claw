# Nginx config for Hugging Face Spaces
# Listens on port 7860 (required by HF Spaces)
# Uses sub_filter to rewrite the hardcoded localhost:8001 → /api
# so the browser calls the correct HF Spaces URL without touching source files.

worker_processes 1;
pid /tmp/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Use /tmp for writable paths (HF Spaces non-root user)
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    access_log /var/log/supervisor/nginx_access.log;
    error_log  /var/log/supervisor/nginx_error.log;

    server {
        listen 7860;
        server_name _;

        root /app/web;
        index index.html;

        # ── Proxy all agent API calls (/api/* → agent:8001) ──────────────────
        location /api/ {
            proxy_pass         http://127.0.0.1:8001/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Required for streaming responses (SSE / chat stream)
            proxy_buffering    off;
            proxy_cache        off;
        }

        # ── Serve static frontend files ───────────────────────────────────────
        # sub_filter rewrites the hardcoded 'http://localhost:8001' in index.html
        # to '/api' at the HTTP layer — no changes to the source file needed.
        location / {
            sub_filter 'http://localhost:8001' '/api';
            sub_filter_once on;
            sub_filter_types text/html;
            gzip off;   # sub_filter requires uncompressed responses

            try_files $uri $uri/ /index.html;
        }
    }
}
