model_list:
  # Default model — user must set their own API key via the Trinity settings UI.
  # The placeholder key allows LiteLLM to start without crashing on Hugging Face Spaces.
  # Supported providers (change model + api_key + api_base in the UI):
  #   NVIDIA:    model: "openai/meta/llama-3.2-90b-vision-instruct"  api_base: "https://integrate.api.nvidia.com/v1"
  #   Claude:    model: "claude-sonnet-4-6"                           api_base: (leave empty)
  #   GPT-4o:    model: "gpt-4o"                                      api_base: (leave empty)
  - model_name: trinity-default
    litellm_params:
      model: "openai/meta/llama-3.2-90b-vision-instruct"
      api_key: "sk-placeholder"
      api_base: "https://integrate.api.nvidia.com/v1"
      supports_function_calling: true
    model_info:
      supports_vision: true
