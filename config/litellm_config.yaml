model_list:

  # Qwen3.5 9B — fast dense model, default driver
  - model_name: trinity-default
    litellm_params:
      model: "ollama/qwen3.5:9b"
      api_base: "http://ollama:11434"
      supports_function_calling: true
    model_info:
      supports_vision: true
      
   # Qwen3.8 27B MoE (~3B active) — heavier tasks, better reasoning
  - model_name: qwen-smart
    litellm_params:
      model: "ollama/qwen3.8-27b-q4ks"
      api_base: "http://ollama:11434"
      supports_function_calling: true
    model_info:
      supports_vision: true


  # Cloud models — switch by setting OLLAMA_MODEL env var or updating litellm code
  # Uncomment below and use MODEL_SOURCE=cloud to enable
  
  # NVIDIA Llama 3.2 90B Vision (free tier, requires NVIDIA_API_KEY)
  - model_name: nvidia-llama-90b
    litellm_params:
      model: "openai/meta/llama-3.2-90b-vision-instruct"
      api_key: "os.environ/NVIDIA_API_KEY"
      api_base: "https://integrate.api.nvidia.com/v1"
      supports_function_calling: true
    model_info:
      supports_vision: true

  # OpenAI GPT-4o (requires OPENAI_API_KEY)
  # - model_name: gpt-4o
  #   litellm_params:
  #     model: "gpt-4o"
  #     api_key: "os.environ/OPENAI_API_KEY"
  #     supports_function_calling: true
  #   model_info:
  #     supports_vision: true

  # Anthropic Claude Sonnet 4.1 (requires ANTHROPIC_API_KEY)
  # - model_name: claude-sonnet
  #   litellm_params:
  #     model: "claude-sonnet-4-20250514"
