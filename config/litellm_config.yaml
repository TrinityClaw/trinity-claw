model_list:
  # One model for everything — text, vision, and tool calls.
  # To switch providers, only change this file. No code changes needed.
  # Examples:
  #   Claude:   model: "claude-sonnet-4-6"  api_key: "os.environ/ANTHROPIC_API_KEY"
  #   GPT-4o:   model: "gpt-4o"             api_key: "os.environ/OPENAI_API_KEY"
  #   NVIDIA:   model: "openai/meta/llama-3.2-90b-vision-instruct"  (current)
  - model_name: trinity-default
    litellm_params:
      model: "openai/meta/llama-3.2-90b-vision-instruct"
      api_key: "os.environ/NVIDIA_API_KEY"
      api_base: "https://integrate.api.nvidia.com/v1"
      supports_function_calling: true
    model_info:
      supports_vision: true      # tells LiteLLM to preserve image content in requests
